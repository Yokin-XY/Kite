<svg xmlns="http://www.w3.org/2000/svg" width="432" height="936" viewBox="0 0 432 936">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".06"/>
    </filter>
  </defs>
  <rect width="432" height="936" fill="#f8fafc"/>
  <text x="38" y="63" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#0f172a">‹</text>
  <text x="216" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">新建配置</text>
  <text x="394" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#6d43e6">✓</text>

  <text x="24" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. 类型</text>
  <rect x="24" y="154" width="88" height="78" rx="18" fill="#ffffff" stroke="#6d43e6" stroke-width="2" filter="url(#softShadow)"/>
  <text x="68" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#6d43e6">◎</text>
  <text x="68" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6d43e6">打开网页</text>
  <rect x="120" y="154" width="88" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <text x="164" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#64748b">▷</text>
  <text x="164" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">启动服务</text>
  <rect x="216" y="154" width="88" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <text x="260" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#64748b">&gt;_</text>
  <text x="260" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">命令+网页</text>
  <rect x="312" y="154" width="88" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <text x="356" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#64748b">▦</text>
  <text x="356" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f172a">模板</text>

  <text x="24" y="304" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">2. 基础信息</text>
  <rect x="24" y="332" width="384" height="330" rx="28" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <text x="48" y="376" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">名称</text>
  <rect x="48" y="394" width="336" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="66" y="431" font-family="Arial, sans-serif" font-size="17" fill="#94a3b8">例如：Hermes WebUI</text>
  <text x="48" y="494" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">地址</text>
  <rect x="48" y="512" width="336" height="58" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="66" y="549" font-family="Arial, sans-serif" font-size="17" fill="#94a3b8">例如：http://127.0.0.1:8648</text>
  <text x="48" y="610" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">创建快捷方式到桌面</text>
  <rect x="324" y="588" width="56" height="31" rx="15.5" fill="#6d43e6"/>
  <circle cx="364" cy="603.5" r="13" fill="#ffffff"/>
  <line x1="48" y1="635" x2="384" y2="635" stroke="#e2e8f0"/>
  <text x="48" y="674" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">高级设置（可选）</text>
  <text x="380" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#64748b">›</text>

  <rect x="0" y="842" width="432" height="94" fill="#ffffff"/>
  <rect x="24" y="858" width="172" height="62" rx="19" fill="#f1f5f9"/>
  <text x="110" y="897" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#0f172a">取消</text>
  <rect x="214" y="858" width="194" height="62" rx="19" fill="#6d43e6"/>
  <text x="311" y="897" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">保存</text>
</svg>
