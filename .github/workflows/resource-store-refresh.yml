name: resource-store-refresh

# 每天自动刷新资源窗口：官方上游查最新 -> 重算签名窗口 -> 构建快照 -> 签名 -> 发布。
# 依赖 Secrets：
#   KITE_STORE_PRIVATE_KEY  商店签名私钥（Base64，tools/resource-store/ResourceStoreSigner.java 格式）
#   KITE_STORE_REPO_TOKEN   发布到商店仓库的写入 token（GitHub PAT 或相应平台 token）
#   GITCODE_API_TOKEN       同步到 GitCode 镜像（gcw_bLi3Mmrf/Kite-Resource-Store）的 API 密钥
on:
  schedule:
    - cron: "17 21 * * *" # 北京时间每日 05:17
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kite
        uses: actions/checkout@v4
        with:
          path: kite

      - name: Checkout resource store
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KITE_STORE_REPO || 'Yokin-XY/Kite-Resource-Store' }}
          token: ${{ secrets.KITE_STORE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: store

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Write signing key
        run: printf '%s' "$KITE_STORE_PRIVATE_KEY" > "$RUNNER_TEMP/store-private.key"
        env:
          KITE_STORE_PRIVATE_KEY: ${{ secrets.KITE_STORE_PRIVATE_KEY }}

      - name: Refresh windows from official upstreams
        run: python3 kite/tools/resource-store/update_windows.py --resources kite/assets/resources

      - name: Build and sign next revision
        run: |
          revision=$(python3 - <<'PY'
          import json
          print(json.load(open("store/store/v1/channels/stable.json"))["revision"] + 1)
          PY
          )
          python3 kite/tools/resource-store/build_snapshot.py \
            --resources kite/assets/resources \
            --output store/store/v1/channels/stable.json \
            --revision "$revision" \
            --key-id kite-store-2026-02
          java kite/tools/resource-store/ResourceStoreSigner.java sign \
            "$RUNNER_TEMP/store-private.key" \
            store/store/v1/channels/stable.json \
            store/store/v1/channels/stable.sig \
            kite-store-2026-02
          rm -f "$RUNNER_TEMP/store-private.key"
          git -C store diff --stat

      - name: Commit refreshed manifests in Kite
        run: |
          cd kite
          if git diff --quiet -- assets/resources; then
            echo "manifests 无变化"
          else
            git config user.name "kite-store-bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/resources
            git commit -m "chore(resources): 自动刷新官方版本窗口"
            git push
          fi

      - name: Publish store revision
        run: |
          cd store
          git config user.name "kite-store-bot"
          git config user.email "actions@users.noreply.github.com"
          git add store/v1/channels
          if git diff --cached --quiet; then
            echo "商店无变化，跳过发布"
          else
            git commit -m "publish revision from upstream refresh"
            git push
          fi

      - name: Sync to GitCode mirror
        if: ${{ secrets.GITCODE_API_TOKEN != '' }}
        env:
          GITCODE_API_TOKEN: ${{ secrets.GITCODE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request

          token = os.environ["GITCODE_API_TOKEN"]
          repo = "gcw_bLi3Mmrf/Kite-Resource-Store"
          api = "https://api.gitcode.com/api/v5"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, payload=None):
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          for name in ("stable.json", "stable.sig"):
              path = f"/repos/{repo}/contents/store/v1/channels/{name}"
              with open(f"store/store/v1/channels/{name}", "rb") as f:
                  content = base64.b64encode(f.read()).decode()
              try:
                  current = call("GET", path + "?ref=main")
                  sha = current.get("sha")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      sha = None
                  else:
                      raise
              payload = {
                  "content": content,
                  "branch": "main",
                  "message": f"sync {name} from GitHub store refresh",
              }
              if sha:
                  payload["sha"] = sha
              result = call("PUT", path, payload)
              print(f"synced {name}: commit={result.get('commit', {}).get('sha', 'n/a')}")
          PY
