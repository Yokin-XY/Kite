name: 贡献方向说明与认领
description: 在开始实现前，公开说明并认领一个功能、修复、测试或文档方向
title: "[共建] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 Kite 共建。这个表单用于在写代码前公开消费场景、预期效果和实现机制，不是申请维护者批准。说明清楚后即可自行认领并从个人 Fork 开始实现；最终是否合并以 Pull Request 的代码、安全和验证审查为准。

        提交前请阅读 [参与开发](https://github.com/Yokin-XY/Kite/blob/main/CONTRIBUTING.md)。资源安装、Shell/PRoot、Agent 进程、认证凭据、Android 权限、构建和发布链会进行额外安全审查。

  - type: textarea
    id: scenario
    attributes:
      label: 消费场景
      description: 谁会在什么情况下使用这项能力？当前具体问题是什么？
      placeholder: 请说明用户、触发入口、当前流程和实际痛点。
    validations:
      required: true

  - type: textarea
    id: effect
    attributes:
      label: 预期效果
      description: 完成后用户能够做什么，会看到什么可验证的变化？
      placeholder: 请描述最终行为，不要只写“优化”“支持”或代码模块名称。
    validations:
      required: true

  - type: textarea
    id: mechanism
    attributes:
      label: 实现机制
      description: 准备通过什么流程、状态拥有者、SDK、Adapter 或其他机制实现？数据从哪里来，由谁消费和保存？
      placeholder: 请说明关键数据流、模块边界、持久化位置及失败回退；不要求先写出完整代码。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 计划范围
      description: 列出计划修改的模块、行为边界和明确不包含的内容。
      placeholder: |
        包含：
        - ...

        不包含：
        - ...
    validations:
      required: true

  - type: checkboxes
    id: risk
    attributes:
      label: 风险范围
      description: 请勾选全部涉及的范围；勾选不会阻止申请，只用于提前确定审查方式。
      options:
        - label: 资源卡、资源清单、下载地址、依赖或第三方脚本
        - label: Shell、终端、PRoot、Bridge 或 Agent 进程
        - label: 网络、认证、凭据、文件访问或 Android 权限
        - label: GitHub Actions、构建、签名、发布或自动更新
        - label: 不涉及以上高风险范围

  - type: textarea
    id: verification
    attributes:
      label: 验证计划
      description: 计划补充哪些测试、构建、页面或真机证据？
      placeholder: 单元测试、静态检查、Debug 构建、真机步骤等。
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: 协作确认
      options:
        - label: 我已在实现前公开说明消费场景、预期效果和实现机制；如机制发生实质变化，我会先更新本 Issue。
          required: true
        - label: 我会自行认领并通过个人 Fork 提交 Pull Request，同时保持一个 PR 只处理一个行为边界。
          required: true
        - label: 我会说明第三方代码、素材、模型、数据和生成内容的来源及许可。
          required: true
