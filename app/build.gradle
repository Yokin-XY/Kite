import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def generatedLegalAssetsDir = layout.buildDirectory.dir("generated/legal-assets")
def resourceDefinitionsDir = rootProject.file("assets/resources")
def generatedResourceCatalogAssetsDir = layout.buildDirectory.dir("generated/resource-catalog-assets")
def generatedNodeRuntimeAssetsDir = layout.buildDirectory.dir("generated/node-runtime-assets")
def toolchainPackDir = rootProject.file("assets/toolchain/ai-dev-pack")
def generatedToolchainIntegrityAssetsDir = layout.buildDirectory.dir("generated/toolchain-integrity-assets")
def syncLegalDocuments = tasks.register("syncLegalDocuments", Sync) {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE.txt" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md"))
    into(generatedLegalAssetsDir.map { it.dir("legal") })
}

def generateResourceCatalogIndex = tasks.register("generateResourceCatalogIndex") {
    inputs.dir(resourceDefinitionsDir)
    outputs.file(generatedResourceCatalogAssetsDir.map { it.file("resources/index.json") })
    doLast {
        def resourceIds = resourceDefinitionsDir.listFiles()
            ?.findAll { it.isDirectory() && new File(it, "manifest.json").isFile() }
            ?.collect { it.name }
            ?.sort() ?: []
        def outputFile = generatedResourceCatalogAssetsDir.get().file("resources/index.json").asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, resources: resourceIds])) + System.lineSeparator(),
            "UTF-8"
        )
    }
}

def syncNodeRuntimeAssets = tasks.register("syncNodeRuntimeAssets", Sync) {
    from(rootProject.file("scripts/kite-node-host-runtime.cjs"))
    into(generatedNodeRuntimeAssetsDir.map { it.dir("node-runtime") })
}

def generateToolchainIntegrityManifest = tasks.register("generateToolchainIntegrityManifest") {
    inputs.dir(toolchainPackDir)
    outputs.file(generatedToolchainIntegrityAssetsDir.map {
        it.file("toolchain/ai-dev-pack/integrity.json")
    })
    doLast {
        def packManifest = new JsonSlurper().parse(new File(toolchainPackDir, "manifest.json"))
        def digestFile = { File file ->
            def digest = MessageDigest.getInstance("SHA-256")
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
            }
            digest.digest().collect { String.format("%02x", it & 0xff) }.join()
        }
        def files = fileTree(toolchainPackDir)
            .files
            .findAll { it.isFile() && it.name != "integrity.json" }
            .collect { file ->
                [
                    path: toolchainPackDir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char),
                    size: file.length(),
                    sha256: digestFile(file),
                ]
            }
            .sort { left, right -> left.path <=> right.path }
        def contentRows = files.collect { file ->
            "${file.path}\u0000${file.size}\u0000${file.sha256}\n"
        }.join().getBytes("UTF-8")
        def contentDigest = MessageDigest.getInstance("SHA-256")
            .digest(contentRows)
            .collect { String.format("%02x", it & 0xff) }
            .join()
        def outputFile = generatedToolchainIntegrityAssetsDir.get()
            .file("toolchain/ai-dev-pack/integrity.json")
            .asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1,
                packageId: packManifest.packId,
                version: packManifest.version,
                contentDigest: contentDigest,
                files: files,
            ])) + System.lineSeparator(),
            "UTF-8"
        )
    }
}

android {
    namespace "com.kite.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.kite.app"
        minSdk 28
        targetSdk 28
        versionCode 14
        versionName "0.4.0"
    }

    androidResources {
        generateLocaleConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            assets.srcDir "../assets"
            assets.srcDir generatedLegalAssetsDir
            assets.srcDir generatedResourceCatalogAssetsDir
            assets.srcDir generatedNodeRuntimeAssetsDir
            assets.srcDir generatedToolchainIntegrityAssetsDir
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要读取 Android 资源/manifest,必须开启
            includeAndroidResources = true
        }
    }

    lint {
        // Kite 当前通过 GitHub 直接分发，并依赖 targetSdk 28 的兼容行为。
        disable "ExpiredTargetSdkVersion"
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncLegalDocuments)
    dependsOn(generateResourceCatalogIndex)
    dependsOn(syncNodeRuntimeAssets)
    dependsOn(generateToolchainIntegrityManifest)
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.agentclientprotocol:acp:0.26.0"
    // 保留 Agent 原生 JSONC/JSON5 配置中的注释和字段顺序，避免整文件降级为普通 JSON。
    implementation "blue.endless:jankson:1.2.3"
    // Hermes 的原生配置是 YAML；只重写目标顶层区段，解析器用于安全读取和写后校验。
    implementation "org.yaml:snakeyaml:2.2"
    // Codex 的用户配置是 TOML；解析器只负责读取和写后校验，定点编辑仍保留未知字段与注释。
    implementation "org.tomlj:tomlj:1.1.1"
    // Agent 正文统一按 GFM 解析为 AST；显示层只消费结构化节点，不再用正则猜 Markdown。
    implementation "org.commonmark:commonmark:0.28.0"
    implementation "org.commonmark:commonmark-ext-autolink:0.28.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.28.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.28.0"
    implementation "org.commonmark:commonmark-ext-task-list-items:0.28.0"
    // ACP 的 JVM transport 通过 kotlin-logging 调用 SLF4J；Android APK 必须显式携带 API。
    implementation "org.slf4j:slf4j-api:2.0.16"
    implementation "org.apache.commons:commons-compress:1.21"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "com.github.termux.termux-app:terminal-emulator:v0.118.3"
    implementation project(":terminal-view-local")
    implementation "dev.rikka.shizuku:aidl:13.1.5"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    testImplementation "junit:junit:4.13.2"
    // T1: 引入 Robolectric,让 CardRunStore 等依赖 Android Context 的模块可在 JVM 上单测
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    // JVM 单测提供实际日志后端；Android 运行时没有绑定时会安全退化为 NOP logger。
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.16"
}
