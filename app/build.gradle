import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.Locale

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def generatedLegalAssetsDir = layout.buildDirectory.dir("generated/legal-assets")
def resourceDefinitionsDir = rootProject.file("assets/resources")
def generatedResourceCatalogAssetsDir = layout.buildDirectory.dir("generated/resource-catalog-assets")
def generatedNodeRuntimeAssetsDir = layout.buildDirectory.dir("generated/node-runtime-assets")
def toolchainPackDir = rootProject.file("assets/toolchain/ai-dev-pack")
def generatedToolchainIntegrityAssetsDir = layout.buildDirectory.dir("generated/toolchain-integrity-assets")
def rustArchiveHostOs = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def rustArchiveWindowsHost = rustArchiveHostOs.contains("windows")
def rustArchiveNdkHostTag = rustArchiveWindowsHost ? "windows-x86_64" :
    (rustArchiveHostOs.contains("linux") ? "linux-x86_64" : "darwin-x86_64")
def cargoExecutable = providers.gradleProperty("kiteCargoExecutable").orElse(
    new File(
        System.getProperty("user.home"),
        rustArchiveWindowsHost ? ".cargo/bin/cargo.exe" : ".cargo/bin/cargo",
    ).absolutePath
)
def rustArchiveManifest = rootProject.file("native/kite-archive-rs/Cargo.toml")
def rustArchiveSource = rootProject.file("native/kite-archive-rs/src")
def rustArchiveTargetDir = rootProject.layout.buildDirectory.dir("rust-target/kite-archive-rs")
def rustArchiveJniDir = layout.buildDirectory.dir("generated/rust-jni/main")
def libarchiveBenchmarkJniDir = layout.buildDirectory.dir("generated/libarchive-jni/debug")
def rustArchiveNdkVersion = "28.2.13676358"
def libarchiveBenchmarkEnabled = providers.gradleProperty("kiteLibarchiveBenchmark")
    .map { it.toBoolean() }
    .orElse(false)
def libarchiveBenchmarkSource = rootProject.file("native/kite-libarchive-c")
def libarchiveBenchmarkBuildDir = rootProject.layout.buildDirectory.dir("native/kite-libarchive-c")
def androidCmakeVersion = "3.22.1"
def syncLegalDocuments = tasks.register("syncLegalDocuments", Sync) {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE.txt" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md"))
    into(generatedLegalAssetsDir.map { it.dir("legal") })
}

def generateResourceCatalogIndex = tasks.register("generateResourceCatalogIndex") {
    inputs.dir(resourceDefinitionsDir)
    outputs.file(generatedResourceCatalogAssetsDir.map { it.file("resources/index.json") })
    doLast {
        def resourceIds = resourceDefinitionsDir.listFiles()
            ?.findAll { it.isDirectory() && new File(it, "manifest.json").isFile() }
            ?.collect { it.name }
            ?.sort() ?: []
        def outputFile = generatedResourceCatalogAssetsDir.get().file("resources/index.json").asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, resources: resourceIds])) + System.lineSeparator(),
            "UTF-8"
        )
    }
}

def syncNodeRuntimeAssets = tasks.register("syncNodeRuntimeAssets", Sync) {
    from(rootProject.file("scripts/kite-node-host-runtime.cjs"))
    into(generatedNodeRuntimeAssetsDir.map { it.dir("node-runtime") })
}

def generateToolchainIntegrityManifest = tasks.register("generateToolchainIntegrityManifest") {
    inputs.dir(toolchainPackDir)
    outputs.file(generatedToolchainIntegrityAssetsDir.map {
        it.file("toolchain/ai-dev-pack/integrity.json")
    })
    doLast {
        def packManifest = new JsonSlurper().parse(new File(toolchainPackDir, "manifest.json"))
        def digestFile = { File file ->
            def digest = MessageDigest.getInstance("SHA-256")
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
            }
            digest.digest().collect { String.format("%02x", it & 0xff) }.join()
        }
        def files = fileTree(toolchainPackDir)
            .files
            .findAll { it.isFile() && it.name != "integrity.json" }
            .collect { file ->
                [
                    path: toolchainPackDir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char),
                    size: file.length(),
                    sha256: digestFile(file),
                ]
            }
            .sort { left, right -> left.path <=> right.path }
        def contentRows = files.collect { file ->
            "${file.path}\u0000${file.size}\u0000${file.sha256}\n"
        }.join().getBytes("UTF-8")
        def contentDigest = MessageDigest.getInstance("SHA-256")
            .digest(contentRows)
            .collect { String.format("%02x", it & 0xff) }
            .join()
        def outputFile = generatedToolchainIntegrityAssetsDir.get()
            .file("toolchain/ai-dev-pack/integrity.json")
            .asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 1,
                packageId: packManifest.packId,
                version: packManifest.version,
                contentDigest: contentDigest,
                files: files,
            ])) + System.lineSeparator(),
            "UTF-8"
        )
    }
}

android {
    namespace "com.kite.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.kite.app"
        minSdk 28
        targetSdk 28
        versionCode 14
        versionName "0.4.0"
    }

    androidResources {
        generateLocaleConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        aidl true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = libarchiveBenchmarkEnabled.get()
        }
    }

    sourceSets {
        main {
            assets.srcDir "../assets"
            assets.srcDir generatedLegalAssetsDir
            assets.srcDir generatedResourceCatalogAssetsDir
            assets.srcDir generatedNodeRuntimeAssetsDir
            assets.srcDir generatedToolchainIntegrityAssetsDir
            jniLibs.srcDir rustArchiveJniDir
        }
        debug {
            jniLibs.srcDir libarchiveBenchmarkJniDir
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要读取 Android 资源/manifest,必须开启
            includeAndroidResources = true
        }
    }

    lint {
        // Kite 当前通过 GitHub 直接分发，并依赖 targetSdk 28 的兼容行为。
        disable "ExpiredTargetSdkVersion"
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncLegalDocuments)
    dependsOn(generateResourceCatalogIndex)
    dependsOn(syncNodeRuntimeAssets)
    dependsOn(generateToolchainIntegrityManifest)
    dependsOn("prepareRustArchiveJniLibs")
}

def buildRustArchive = tasks.register("buildRustArchive", Exec) {
    workingDir rootProject.projectDir
    inputs.file(rustArchiveManifest)
    inputs.file(rootProject.file("native/kite-archive-rs/Cargo.lock"))
    inputs.file(rootProject.file("rust-toolchain.toml"))
    inputs.dir(rustArchiveSource)
    outputs.file(rustArchiveTargetDir.map {
        it.file("aarch64-linux-android/release/libkite_archive_rs.so")
    })
    doFirst {
        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        if (androidHome == null || androidHome.isBlank()) {
            throw new GradleException("ANDROID_HOME or ANDROID_SDK_ROOT is required for the production Rust archive engine")
        }
        def llvmBin = new File(
            androidHome,
            "ndk/${rustArchiveNdkVersion}/toolchains/llvm/prebuilt/${rustArchiveNdkHostTag}/bin"
        )
        def linker = new File(
            llvmBin,
            rustArchiveWindowsHost ? "aarch64-linux-android28-clang.cmd" : "aarch64-linux-android28-clang",
        )
        def archiver = new File(llvmBin, rustArchiveWindowsHost ? "llvm-ar.exe" : "llvm-ar")
        if (!linker.isFile() || !archiver.isFile()) {
            throw new GradleException("Pinned Android NDK ${rustArchiveNdkVersion} is unavailable")
        }
        environment "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER", linker.absolutePath
        environment "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR", archiver.absolutePath
        environment "CC_aarch64_linux_android", linker.absolutePath
        environment "AR_aarch64_linux_android", archiver.absolutePath
        environment "CARGO_TARGET_DIR", rustArchiveTargetDir.get().asFile.absolutePath
        commandLine(
            cargoExecutable.get(),
            "build",
            "--locked",
            "--manifest-path",
            rustArchiveManifest.absolutePath,
            "--target",
            "aarch64-linux-android",
            "--release",
        )
    }
}

def prepareRustArchiveJniLibs = tasks.register("prepareRustArchiveJniLibs") {
    dependsOn(buildRustArchive)
    inputs.file(rustArchiveTargetDir.map {
        it.file("aarch64-linux-android/release/libkite_archive_rs.so")
    })
    outputs.dir(rustArchiveJniDir)
    doLast {
        def output = rustArchiveJniDir.get().asFile
        delete(output)
        copy {
            from(rustArchiveTargetDir.map {
                it.file("aarch64-linux-android/release/libkite_archive_rs.so")
            })
            into(new File(output, "arm64-v8a"))
        }
    }
}

def prepareLibarchiveBenchmarkJniLibs = tasks.register("prepareLibarchiveBenchmarkJniLibs") {
    dependsOn("buildLibarchiveBenchmark")
    outputs.dir(libarchiveBenchmarkJniDir)
    outputs.upToDateWhen { false }
    doLast {
        def output = libarchiveBenchmarkJniDir.get().asFile
        delete(output)
        if (libarchiveBenchmarkEnabled.get()) {
            copy {
                from(libarchiveBenchmarkBuildDir.map { it.file("kite_libarchive_benchmark") })
                into(new File(output, "arm64-v8a"))
                rename { "libkite_libarchive_benchmark.so" }
            }
        }
    }
}

def configureLibarchiveBenchmark = tasks.register("configureLibarchiveBenchmark", Exec) {
    onlyIf { libarchiveBenchmarkEnabled.get() }
    inputs.file(rootProject.file("native/kite-libarchive-c/CMakeLists.txt"))
    inputs.file(rootProject.file("native/kite-libarchive-c/kite_libarchive_benchmark.c"))
    outputs.file(libarchiveBenchmarkBuildDir.map { it.file("CMakeCache.txt") })
    doFirst {
        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        if (androidHome == null || androidHome.isBlank()) {
            throw new GradleException("ANDROID_HOME or ANDROID_SDK_ROOT is required for the libarchive benchmark")
        }
        def cmake = new File(androidHome, "cmake/${androidCmakeVersion}/bin/cmake.exe")
        def ninja = new File(androidHome, "cmake/${androidCmakeVersion}/bin/ninja.exe")
        def toolchain = new File(
            androidHome,
            "ndk/${rustArchiveNdkVersion}/build/cmake/android.toolchain.cmake"
        )
        if (!cmake.isFile() || !ninja.isFile() || !toolchain.isFile()) {
            throw new GradleException("Pinned Android CMake/NDK toolchain is unavailable")
        }
        commandLine(
            cmake.absolutePath,
            "-S", libarchiveBenchmarkSource.absolutePath,
            "-B", libarchiveBenchmarkBuildDir.get().asFile.absolutePath,
            "-G", "Ninja",
            "-DCMAKE_MAKE_PROGRAM=${ninja.absolutePath}",
            "-DCMAKE_TOOLCHAIN_FILE=${toolchain.absolutePath}",
            "-DANDROID_ABI=arm64-v8a",
            "-DANDROID_PLATFORM=android-28",
            "-DCMAKE_BUILD_TYPE=Release",
        )
    }
}

tasks.register("buildLibarchiveBenchmark", Exec) {
    onlyIf { libarchiveBenchmarkEnabled.get() }
    dependsOn(configureLibarchiveBenchmark)
    inputs.dir(libarchiveBenchmarkSource)
    outputs.file(libarchiveBenchmarkBuildDir.map { it.file("kite_libarchive_benchmark") })
    doFirst {
        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
        def cmake = new File(androidHome, "cmake/${androidCmakeVersion}/bin/cmake.exe")
        commandLine(
            cmake.absolutePath,
            "--build", libarchiveBenchmarkBuildDir.get().asFile.absolutePath,
            "--target", "kite_libarchive_benchmark",
            "--config", "Release",
            "-j", Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)),
        )
    }
}

tasks.configureEach { task ->
    if (task.name == "preDebugBuild") {
        task.dependsOn(prepareLibarchiveBenchmarkJniLibs)
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.agentclientprotocol:acp:0.26.0"
    // 保留 Agent 原生 JSONC/JSON5 配置中的注释和字段顺序，避免整文件降级为普通 JSON。
    implementation "blue.endless:jankson:1.2.3"
    // Hermes 的原生配置是 YAML；只重写目标顶层区段，解析器用于安全读取和写后校验。
    implementation "org.yaml:snakeyaml:2.2"
    // Codex 的用户配置是 TOML；解析器只负责读取和写后校验，定点编辑仍保留未知字段与注释。
    implementation "org.tomlj:tomlj:1.1.1"
    // Agent 正文统一按 GFM 解析为 AST；显示层只消费结构化节点，不再用正则猜 Markdown。
    implementation "org.commonmark:commonmark:0.28.0"
    implementation "org.commonmark:commonmark-ext-autolink:0.28.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.28.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.28.0"
    implementation "org.commonmark:commonmark-ext-task-list-items:0.28.0"
    // ACP 的 JVM transport 通过 kotlin-logging 调用 SLF4J；Android APK 必须显式携带 API。
    implementation "org.slf4j:slf4j-api:2.0.16"
    implementation "org.apache.commons:commons-compress:1.21"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "com.github.termux.termux-app:terminal-emulator:v0.118.3"
    implementation project(":terminal-view-local")
    implementation "dev.rikka.shizuku:aidl:13.1.5"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    testImplementation "junit:junit:4.13.2"
    // T1: 引入 Robolectric,让 CardRunStore 等依赖 Android Context 的模块可在 JVM 上单测
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    // JVM 单测提供实际日志后端；Android 运行时没有绑定时会安全退化为 NOP logger。
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.16"
}
