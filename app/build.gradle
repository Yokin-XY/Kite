plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def generatedLegalAssetsDir = layout.buildDirectory.dir("generated/legal-assets")
def syncLegalDocuments = tasks.register("syncLegalDocuments", Sync) {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE.txt" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md"))
    into(generatedLegalAssetsDir.map { it.dir("legal") })
}

android {
    namespace "com.kite.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.kite.app"
        minSdk 28
        targetSdk 28
        versionCode 8
        versionName "0.2.3"
    }

    androidResources {
        generateLocaleConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            assets.srcDir "../assets"
            assets.srcDir generatedLegalAssetsDir
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要读取 Android 资源/manifest,必须开启
            includeAndroidResources = true
        }
    }

    lint {
        // Kite 当前通过 GitHub 直接分发，并依赖 targetSdk 28 的兼容行为。
        disable "ExpiredTargetSdkVersion"
    }
}

tasks.named("preBuild").configure {
    dependsOn(syncLegalDocuments)
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.apache.commons:commons-compress:1.21"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "com.github.termux.termux-app:terminal-emulator:v0.118.3"
    implementation project(":terminal-view-local")
    implementation "dev.rikka.shizuku:aidl:13.1.5"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    testImplementation "junit:junit:4.13.2"
    // T1: 引入 Robolectric,让 CardRunStore 等依赖 Android Context 的模块可在 JVM 上单测
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
}
